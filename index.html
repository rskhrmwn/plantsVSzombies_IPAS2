<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Selamatkan Sistem Pernapasan</title>
<style>
:root{--card:#fff7dc;--ink:#2a2416;--wood:#7a4e2b;--sun:#f6c026;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:#cfe9b0}html,body{min-height:100vh;background:linear-gradient(#bfe6ff,#e8f7d8 45%,#cfe9b0);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
body{background:#cfc8b0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
.wrap{width:100%;max-width:980px;padding:8px;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;background:linear-gradient(#8a5a35,#6a4125);border:3px solid #4a2d15;border-radius:12px;padding:6px 8px;color:#fff}
.seed{background:var(--card);color:var(--ink);border:2px solid #b49a62;border-radius:8px;padding:3px 8px;min-width:74px;font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.seed b{display:block;font-size:20px}.seed small{display:inline-block;background:#e8d99a;border-radius:6px;padding:0 6px}
.si{height:30px;width:auto;display:block;margin:0 auto 2px}.seed:disabled{opacity:.45}
.sunbox{background:var(--card);color:var(--ink);border:2px solid #b49a62;border-radius:8px;display:flex;align-items:center;gap:6px;padding:2px 10px;font-weight:800;font-size:24px}
.sunbox img{height:34px}
.mid{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-weight:700;font-size:14px}
.pbar{position:relative;margin-top:8px;height:14px;background:#2a1a0a;border-radius:8px;border:2px solid #1a0f05}
.pbar i{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(#b6e04c,#69a31e);border-radius:6px;width:0;transition:width .4s}
.pbar img{position:absolute;top:-14px;height:34px;transform:translateX(-50%);transition:left .4s}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--sun);color:#3a2a00;min-height:42px}
button:focus-visible{outline:3px solid #2a6df4;outline-offset:2px}
.menu{background:#2d4a63;color:#9fe36a;border:2px solid #1b2f40;font-size:18px}
.field{container-type:inline-size;position:relative;aspect-ratio:954/540;width:100%;border-radius:12px;overflow:hidden;border:3px solid #3b6a24;background:#5fb23a}
.fence{position:absolute;left:0;right:0;top:11%;height:13%;background:linear-gradient(#cfc6a8,#cfc6a8) 0 32%/100% 5% no-repeat,linear-gradient(#cfc6a8,#cfc6a8) 0 72%/100% 5% no-repeat,repeating-linear-gradient(90deg,#fffef6 0 3.4%,transparent 3.4% 4.6%);filter:drop-shadow(0 .4cqw .3cqw rgba(0,0,0,.3))}
.house{position:absolute;left:0;top:24%;bottom:0;width:14.5%;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 12%),repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 2px,transparent 2px 50%),#dcd5bc}
.lawn{position:absolute;left:14.5%;right:2.5%;top:24%;height:68%;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.16) 0 2px,transparent 3px) 0 0/31px 29px,radial-gradient(circle at 70% 60%,rgba(0,70,0,.16) 0 3px,transparent 4px) 0 0/47px 43px,radial-gradient(circle at 20% 10%,rgba(255,255,160,.3),transparent 45%),repeating-conic-gradient(#7ad147 0 25%,#69c13a 0 50%) 0 0/22.22% 40%;border-radius:.8cqw;box-shadow:0 0 0 .6cqw #3f9a2a,0 1cqw 1.4cqw rgba(0,0,0,.35)}
.lane{position:absolute;left:0;right:0;height:20%}.lane:nth-child(even){background:none}
.ent{position:absolute;transform:translate(-50%,-72%)}
.plant{height:7.5cqw;width:auto;display:block}.sf{height:5.8cqw;width:auto;display:block}
.mow{position:absolute;width:5cqw;height:3cqw;background:#c8321f;border-radius:.6cqw;transform:translate(-50%,-30%);border-bottom:.6cqw solid #333}
.z img{display:block;height:var(--h);width:auto;filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.4))}
.z.ice img{filter:hue-rotate(160deg) brightness(1.2) drop-shadow(0 0 .8cqw #9df)}
.z.hit img{filter:brightness(1.7) drop-shadow(0 0 1cqw #fff)}
.z.die{animation:die .5s forwards}@keyframes die{to{opacity:0;transform:translate(-50%,-72%) rotate(80deg) scale(.4)}}
.hpb{position:absolute;left:10%;right:10%;top:-4%;height:.9cqw;background:#400;border-radius:1cqw;overflow:hidden}.hpb i{display:block;height:100%;background:#e84}
.pea{position:absolute;width:1.7cqw;height:1.7cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6ff9a,#7fd23c);border:.25cqw solid #2d6a1a;box-shadow:0 0 .8cqw #b8ff6a;transform:translate(-50%,-50%)}
.sunfall{position:absolute;width:6cqw;cursor:pointer;transition:top 6s linear;z-index:3;animation:glow 1s infinite alternate;background:none;padding:0;min-height:0}
.sunfall img{width:100%;display:block}@keyframes glow{to{filter:drop-shadow(0 0 1.5cqw #ffd84a)}}
.ent.pl,.ent.sf{transform:translate(-50%,-56%)}
.rot{display:none;text-align:center;font-size:13px;font-weight:700;background:#fff7dc;border-radius:8px;padding:6px}@media(max-width:600px) and (orientation:portrait){.rot{display:block}}
.sky{position:absolute;left:0;right:0;top:0;height:26%;background:linear-gradient(#4fb0ff,#cdeeff)}
.sky i{position:absolute;height:3cqw;width:9cqw;background:#fff;border-radius:3cqw;box-shadow:3cqw -1.2cqw 0 -.4cqw #fff,-2.5cqw -.6cqw 0 -.6cqw #fff;opacity:.92;animation:drift 70s linear infinite}
.sky i:nth-child(1){top:12%}.sky i:nth-child(2){top:34%;animation-delay:-25s;transform:scale(.8)}.sky i:nth-child(3){top:6%;animation-delay:-48s;transform:scale(1.2)}
@keyframes drift{from{left:-18%}to{left:108%}}
.hedge{position:absolute;left:0;right:0;top:6%;height:9%;background:radial-gradient(circle at 50% 75%,#58bf45 0 58%,transparent 60%) 0 0/5.5% 100% repeat-x,linear-gradient(transparent 60%,#2f7d2a 60%)}
.paveb{position:absolute;left:0;right:0;top:92%;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 2px,transparent 2px 9%),#dcd5bc}
.rays{position:absolute;left:-14%;top:-34%;width:62%;aspect-ratio:1;background:repeating-conic-gradient(rgba(255,244,170,.34) 0 6deg,transparent 6deg 16deg);border-radius:50%;animation:spin 50s linear infinite;pointer-events:none;z-index:2;-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 68%);mask-image:radial-gradient(circle,#000 15%,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes walk{from{transform:rotate(-3.5deg) translateY(0)}to{transform:rotate(3.5deg) translateY(-.7cqw)}}
.plant,.sf{transform-origin:50% 95%;animation:sway 1.8s ease-in-out infinite alternate}
.z img{transform-origin:50% 100%;animation:walk .55s ease-in-out infinite alternate}
.z.ice img,.z.hit img{animation-play-state:paused}
.dc{position:absolute;font-size:1.7cqw;transform-origin:50% 100%;animation:sway 2.5s ease-in-out infinite alternate;pointer-events:none;opacity:.92}
.bf{position:absolute;font-size:2.4cqw;left:-5%;pointer-events:none;z-index:2;animation:fly 18s linear infinite}
@keyframes fly{0%{left:-5%;transform:translateY(0)}25%{transform:translateY(-3cqw)}50%{transform:translateY(2cqw)}75%{transform:translateY(-2cqw)}100%{left:105%;transform:translateY(1cqw)}}
.toast{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;z-index:4;white-space:nowrap}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(20,14,6,.72);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
.ov[hidden]{display:none}
.box{background:var(--card);border:3px solid #b49a62;border-radius:16px;max-width:600px;width:100%;padding:16px;max-height:92vh;overflow:auto}
.box h2{margin:0 0 6px;font-size:20px}.box p{margin:6px 0;line-height:1.45}
.tag{display:inline-block;background:#2f8f46;color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;margin-bottom:6px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{background:#fff;color:var(--ink);border:2px solid #c9bb8a;text-align:left;font-weight:600}
.opt.ok{background:#c9f0d0;border-color:#2f8f46}.opt.no{background:#f9cfcf;border-color:#d64545}.opt.sel{border-color:#2a6df4;background:#e6efff}
.opt:disabled{opacity:.95}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:#d9f0c9;border:2px solid #7fb35f;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mc{background:#fff;border:2px solid #cfc08a;border-radius:10px;padding:8px;font-size:14px}.mc h3{margin:0 0 4px;font-size:15px;color:#a35a00}
.mc ul{margin:0;padding-left:18px}
.tm{height:8px;background:#e2d6a8;border-radius:6px;overflow:hidden;margin-top:8px}.tm i{display:block;height:100%;width:100%;background:#d64545}
.fb{margin-top:10px;line-height:1.45}
.wm{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:11px;font-weight:700;color:rgba(40,30,15,.55);pointer-events:none;z-index:9;letter-spacing:.3px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="wrap">
 <div class="hud">
  <button class="seed" id="pf" title="Bekukan semua zombie 6 detik"><img id="iy" class="si" alt="">Pembeku<br><small>50</small></button>
  <button class="seed" id="pb" title="Musnahkan semua zombie di taman"><img id="ic" class="si" alt="">Bom<br><small>75</small></button>
  <div class="sunbox"><img id="sunic" alt="Matahari"><span id="sun">50</span></div>
  <div class="mid"><div style="display:flex;gap:12px;align-items:center"><span id="lvl"></span><span id="lives"></span></div><div class="pbar"><i id="pg"></i><img id="zh" alt="" style="left:0"></div></div>
  <button class="menu" id="snd" aria-label="Suara">🔊</button><button class="menu" id="mn">Menu</button>
 </div>
 <div class="rot">Tips: putar HP ke mode landscape agar taman lebih besar.</div>
 <div class="field" id="field">
  <div class="sky"><i></i><i></i><i></i></div><div class="hedge"></div><div class="fence"></div><div class="house"></div><div class="paveb"></div>
  <div class="lawn" id="lawn"><div class="lane" style="top:0"></div><div class="lane" style="top:20%"></div><div class="lane" style="top:40%"></div><div class="lane" style="top:60%"></div><div class="lane" style="top:80%"></div></div>
  <div class="rays"></div><div class="toast" id="toast"></div>
 </div>
 <div style="text-align:center;font-size:13px">Tanaman menembak otomatis. Ketuk matahari yang jatuh untuk mengumpulkannya. Zombie yang tertembak memberi tantangan!</div>
</div>
<div class="wm">Riski Hermawan</div>

<div class="ov" id="intro"><div class="box" id="ib"></div></div>
<div class="ov" id="mat" hidden><div class="box"><h2>Materi: Sistem Pernapasan</h2><p style="font-size:13px">Baca dulu, lalu kalahkan zombie dengan ilmumu.</p><div id="mb"></div><button id="mx" style="margin-top:10px">Tutup</button></div></div>
<div class="ov" id="menu" hidden><div class="box"><h2>Menu</h2><div class="opts"><button id="m1">Buka materi</button><button id="m2">Ulangi level ini</button><button id="m3">Lanjutkan bermain</button></div></div></div>
<div class="ov" id="qov" hidden><div class="box">
 <span class="tag" id="qtag"></span><div id="qt" style="font-size:18px;font-weight:700;line-height:1.4"></div>
 <div id="qb"></div><div class="tm" id="tmw" hidden><i id="tmb"></i></div>
 <div class="fb" id="fb"></div>
 <div style="display:flex;gap:8px;margin-top:10px"><button id="hint">💡 Petunjuk (25)</button><button id="nx" hidden>Lanjut</button></div>
</div></div>
<div class="ov" id="end" hidden><div class="box"><h2 id="et"></h2><p id="em"></p><button id="eb"></button></div></div>

  shuf(c[2].map((p,i)=>({t:p[1],i}))).forEach(o=>{const x=btn(o.t);x.onclick=()=>{if(!sel||x.disabled)return;if(+sel.dataset.i===o.i){sel.classList.remove("sel");sel.classList.add("ok");x.classList.add("ok");sel.disabled=x.disabled=true;sel=null;C.n++;if(C.n===c[2].length)fin(C.mis<=2,null);}else{C.mis++;x.classList.add("shake");setTimeout(()=>x.classList.remove("shake"),300);toast("Belum cocok ("+C.mis+"/3 salah)");if(C.mis>=3)fin(false,null);}};R.appendChild(x);});
  b.append(L1,R);
 }
 $("tmw").hidden=!(L>=2&&(T==="m"||T==="t"||T==="f"));
 clearInterval(tmr);
 if(!$("tmw").hidden){let t=15;$("tmb").style.width="100%";tmr=setInterval(()=>{t-=.1;$("tmb").style.width=(t/15*100)+"%";if(t<=0){clearInterval(tmr);if(!C.fin)fin(false,null,true);}},100);}
 $("qov").hidden=false;
}
function btn(t){const x=document.createElement("button");x.className="opt";x.textContent=t;return x;}
function fin(ok,x,timeout){
 if(C.fin)return;C.fin=1;clearInterval(tmr);
 const c=C.c;
 document.querySelectorAll("#qb .opt").forEach(e=>{e.disabled=true;if(c[0]==="m"||c[0]==="f"){if(+e.dataset.i===c[3])e.classList.add("ok");}});
 if(c[0]==="t"){const a=c[2]?"Benar":"Salah";document.querySelectorAll("#qb .opt").forEach(e=>{if(e.textContent===a)e.classList.add("ok");});}
 if(!ok&&x)x.classList.add("no");
 const ex=c[0]==="o"||c[0]==="j"?c[c.length-1]:c[c.length-1];
 let msg;
 if(ok){SFX.ok();G.streak++;const bonus=G.streak>=3?5:0;G.sc+=10+bonus;G.sun+=25;msg="Benar! +"+(10+bonus)+" skor, +25 matahari."+(bonus?" Beruntun "+G.streak+"x!":"");}
 else{SFX.bad();G.streak=0;G.mist++;msg=(timeout?"Waktu habis. ":"Belum tepat. ")+"Zombie maju.";}
 $("fb").innerHTML="<b>"+msg+"</b> "+ex;C.ok=ok;$("nx").hidden=false;$("nx").focus();$("hint").hidden=true;hud();
}
$("hint").onclick=()=>{
 if(!C||C.fin||C.hintUsed||G.sun<25)return;G.sun-=25;C.hintUsed=1;hud();
 const w=[...document.querySelectorAll("#qb .opt")].filter(e=>+e.dataset.i!==C.c[3]);
 shuf(w).slice(0,Math.max(1,w.length-1)).forEach(e=>{e.disabled=true;e.style.opacity=.3;});
 $("hint").hidden=true;
};
$("nx").onclick=()=>{
 $("qov").hidden=true;const z=C.z;z.e.classList.remove("hit");
 if(C.ok){
  z.ch.shift();
  if(z.boss){const h=z.e.querySelector(".hpb i");if(h)h.style.width=(z.ch.length/3*100)+"%";}
  if(z.ch.length===0){kill(z);}
  else if(z.boss){ask(z);return;}
 }else{z.x+=0;z.x-=9;setX(z);}
 S.st="play";S.last=performance.now();hud();
};
/* alur level */
function win(){
 S.st="end";clear_peas();SFX.win();
 const st=G.lives===3&&G.mist<=1?3:G.lives>=2?2:1;
 G.sc+=st*20;
 const last=L===LV.length-1;
 $("et").textContent=last?"Taman Selamat! Selamat!":"Level selesai! "+"⭐".repeat(st);
 $("em").innerHTML=(last?"Raja Zombie kalah dan paru-paru taman terjaga. ":"Kamu mengalahkan semua zombie. ")+"Skor: <b>"+G.sc+"</b>. Bonus bintang: +"+st*20+".";
 $("eb").textContent=last?"Main dari awal":"Lanjut ke level berikutnya";
 $("eb").onclick=()=>{$("end").hidden=true;if(last){G={sc:0,sun:50,lives:3,streak:0,mist:0};showIntro(0);}else showIntro(L+1);};
 $("end").hidden=false;
}
function over(){
 S.st="end";clear_peas();SFX.lose();
 $("et").textContent="Taman diserbu zombie";$("em").textContent="Nyawa habis. Baca materinya lagi lalu coba ulangi level ini. Skor: "+G.sc+".";
 $("eb").textContent="Ulangi level";$("eb").onclick=()=>{$("end").hidden=true;showIntro(L);};$("end").hidden=false;
}
function showIntro(i){
 if(S)S.st="gone";
 const d=LV[i];
 $("ib").innerHTML='<h2>'+d.n+'</h2><p><b>Materi:</b> '+d.i+'</p><p>Zombie: '+d.z.length+' · Tantangan: '+(["pilihan ganda dan benar/salah","urutkan dan jodohkan","dengan batas waktu 15 detik","campuran lebih sulit","termasuk Raja Zombie"][i])+'</p><div class="opts"><button id="im">Baca materi</button><button id="ig">Mulai level</button></div><p style="font-size:11px;opacity:.7;margin-top:10px">Media belajar nonkomersial. Karakter Plants vs. Zombies adalah milik PopCap/Electronic Arts.</p>';
 $("im").onclick=()=>{$("mb").innerHTML=MAT;$("mat").hidden=false;};
 $("ig").onclick=()=>{$("intro").hidden=true;start(i);};
 $("intro").hidden=false;
}
$("snd").onclick=()=>{au();mute(!MUT);};
$("mx").onclick=()=>$("mat").hidden=true;
$("mn").onclick=()=>{if(S&&S.st==="play")S.st="pause";$("menu").hidden=false;};
$("m1").onclick=()=>{$("mb").innerHTML=MAT;$("mat").hidden=false;};
$("m2").onclick=()=>{$("menu").hidden=true;showIntro(L);};
$("m3").onclick=()=>{$("menu").hidden=true;if(S&&S.st==="pause"){S.st="play";S.last=performance.now();}};
$("sunic").src=IMG.sun;$("iy").src=IMG.yeti;$("ic").src=IMG.cherry;$("zh").src=IMG.z1;

const f=$("field");["🦋","🐝","🦋"].forEach((c,i)=>{const e=document.createElement("span");e.className="bf";e.textContent=c;e.style.top=(30+i*18)+"%";e.style.animationDuration=(16+i*5)+"s";e.style.animationDelay=(-i*6)+"s";f.appendChild(e);});})();
showIntro(0);
